<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Reaction · Channel Reaction Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- TAMBAHAN: ERUDA (Console untuk HP) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script type="module" src="/js/app.js"></script>

  <!-- TAMBAHAN: PENANGKAP ERROR AGAR TIDAK LAYAR PUTIH -->
  <script>
    window.addEventListener('error', function(e) {
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = `
          <div style="padding:20px;font-family:sans-serif;background:#fee;color:#900;border:2px solid #f00;margin:20px;border-radius:8px;font-size:14px;">
            <h3 style="margin-top:0;">⚠️ ERROR TERDETEKSI!</h3>
            <p><b>Pesan:</b> ${e.message}</p>
            <p><b>File:</b> ${e.filename}</p>
            <p><b>Baris:</b> ${e.lineno}</p>
            <button onclick="location.reload()" style="padding:10px;background:#900;color:#fff;border:none;border-radius:5px;width:100%;font-weight:bold;">Muat Ulang</button>
          </div>`;
      }
    });
  </script>
</body>
</html>
