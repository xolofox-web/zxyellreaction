<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Reaction · Channel Reaction Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  
  <!-- TAMBAHAN: Mencegah layar berkedip putih sebelum app.js selesai dimuat -->
  <style>
    body { background-color: #09090b; margin: 0; }
  </style>
</head>
<body>
  <!-- DIUBAH: Teks "Memuat..." dihapus agar tidak bertabrakan dengan animasi loading dari app.js -->
  <div id="app"></div>
  <div id="toast-wrap" class="toast-wrap"></div>

  <script>
    // PENANGKAP ERROR: Jika ada file JS yang gagal dimuat, tampilkan di layar
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await import('/js/app.js');
      } catch (err) {
        document.getElementById('app').innerHTML = `
          <div style="padding:20px; font-family:sans-serif; background:#fee; color:#900; border:2px solid red; margin:20px; border-radius:8px;">
            <h3>⚠️ Gagal Memuat Website</h3>
            <p><b>Pesan Error:</b> ${err.message}</p>
            <p style="font-size:12px; word-break:break-all;">${err.stack || ''}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
