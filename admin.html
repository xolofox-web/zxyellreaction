<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard · WA Reaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- DIV UNTUK ADMIN -->
  <div id="admin-app">Memuat Admin...</div>
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- PENDETEKSI ERROR -->
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('admin-app').innerHTML = `
        <div style="padding:20px;font-family:sans-serif;color:red;">
          <h3>Error Admin:</h3>
          <p>${e.message}</p>
          <p>File: ${e.filename} (Baris: ${e.lineno})</p>
        </div>`;
    });
  </script>
  <script type="module" src="/js/admin-app.js"></script>
</body>
</html>
